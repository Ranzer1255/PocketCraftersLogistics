[mod-name]
internal-mod-name=Pocket Crafter's Logistics

[mod-description]
internal-mod-name=Request the materials to hand craft an item.

[mod-setting-name]
pc-craft-order-multiple=Order Mulitplier
pc-recuseive-ordering=Recursive Order


[pc-gui]
request-button-tooltip=[font=default-bold]Handcraft Request[/font]\nHold an item or ghost in your hand, then:\n[font=default-semibold]Left-click:[/font] request materials for 1 craft\n[font=default-semibold]Right-click:[/font] request materials for 5 crafts\n[font=default-semibold]Shift + click:[/font] request materials for 10 crafts\n[font=default-semibold]Ctrl + Shift + click:[/font] request materials for 100 crafts\nAll amounts are multiplied by your Order Multiplier setting.

[mod-setting-description]
pc-craft-order-multiple=change to order enough ingredients to craft x items.
pc-recuseive-ordering=when enabled, will check the Logistic network for intermedate materials. if they are not available and the intermedate is hand craftable, it will instead request the materials to craft the intermedate instead.